events {}

http {
    server {
        listen 80;

        # Docker's embedded DNS. Re-resolving the upstream lets nginx follow the
        # API container to its new IP after a redeploy (no stale 502s).
        resolver 127.0.0.11 valid=10s;
        set $calculator_upstream http://calculator-api:8080;

        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
        }

        location / {
            proxy_pass $calculator_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
